[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-loop"
version = "0.1.0"
description = "Multi-agent development loop: lightweight agents review, test, and log the work of a primary coding agent."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["agentic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
